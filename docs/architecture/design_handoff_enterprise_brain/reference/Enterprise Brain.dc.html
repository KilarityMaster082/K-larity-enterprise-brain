<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1b1b1b;font-family:'Google Sans',system-ui,sans-serif;color:#1b1b1b}
a{color:#1b1b1b}a:hover{color:#000}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.8}}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.2}}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes wedge{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-10px)}}
@keyframes type{from{width:0}to{width:100%}}
</style>
</helmet>
<div style="display:flex;gap:24px;padding:24px;min-height:100vh;box-sizing:border-box;align-items:flex-start">
  <aside style="width:264px;flex:none;position:sticky;top:24px;height:calc(100vh - 48px);max-height:940px;overflow:auto;color:#eee;padding-right:6px">
    <div style="display:flex;align-items:center;gap:10px;padding:4px 6px 14px"><img src="packages/ui/brand/logo-on-dark.png" style="height:26px" alt="K!larity"><span style="font-size:11px;color:#9a9aa4">Enterprise Brain · 54 screens</span></div>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="8">
      <div style="margin-bottom:14px">
        <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#77777f;padding:6px 8px;font-weight:700">{{ g.label }}</div>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <div onClick="{{ it.go }}" style="display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;cursor:pointer;font-size:12.5px;background:{{ it.bg }};color:{{ it.fg }};font-weight:{{ it.fw }}"><span style="font:500 10px 'JetBrains Mono',monospace;opacity:.6;width:18px">{{ it.n }}</span>{{ it.title }}</div>
        </sc-for>
      </div>
    </sc-for>
  </aside>

  <div style="flex:1;min-width:760px;max-width:1360px;height:calc(100vh - 48px);max-height:940px;border-radius:34px;background:linear-gradient(135deg,#e8e2f0 0%,#e3e9f4 42%,#f3e6e4 100%);position:relative;overflow:hidden;display:flex;box-shadow:0 30px 80px rgba(0,0,0,.5)">
    <nav style="width:74px;flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 0">
      <img src="packages/ui/brand/mark.png" style="width:30px;margin-bottom:18px" alt="">
      <sc-for list="{{ rail }}" as="r" hint-placeholder-count="8">
        <div onClick="{{ r.go }}" title="{{ r.label }}" style="width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:{{ r.bg }};color:{{ r.fg }};transition:.2s"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><sc-for list="{{ r.paths }}" as="p" hint-placeholder-count="2"><path d="{{ p }}"></path></sc-for></svg></div>
      </sc-for>
      <div style="margin-top:auto;width:34px;height:34px;border-radius:50%;background:#d2ff1f;display:grid;place-items:center;font-size:11px;font-weight:700">MK</div>
    </nav>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <header style="display:flex;align-items:center;padding:18px 26px 8px 8px;gap:14px;white-space:nowrap;flex:none">
        <div style="font-size:12px;color:#5d5b66;display:flex;gap:8px;align-items:center"><span style="font:500 11px 'JetBrains Mono',monospace;background:#fff;border-radius:99px;padding:4px 10px">{{ cur.route }}</span></div>

        <div style="display:flex;align-items:center;gap:8px;border:1px solid rgba(0,0,0,.15);border-radius:99px;padding:7px 14px;font-size:11px;background:rgba(255,255,255,.4)">Studio 8 Hats <span>▾</span></div>
        <div style="width:34px;height:34px;border-radius:50%;background:#0e0e0e;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:600">⌘K</div>
      </header>
      <main style="flex:1;overflow:auto;padding:8px 26px 30px 8px;zoom:.74">
        <div style="display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:11px;white-space:nowrap;flex-wrap:wrap"><span style="background:#0e0e0e;color:#fff;border-radius:99px;padding:4px 10px;font-weight:600">{{ cur.n }} / 54</span><span style="color:#5d5b66">{{ cur.title }} · {{ cur.role }}</span><span style="border-radius:99px;padding:4px 10px;background:#d2ff1f;font-weight:600">{{ cur.status }}</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 10px;animation:fadeUp .4s both">
          <sc-for list="{{ brief.m }}" as="m" hint-placeholder-count="4"><div style="border-radius:14px;background:{{ m.bg }};padding:9px 12px;display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.l }}</div><div style="font-size:17px;font-weight:600;letter-spacing:-.02em">{{ m.v }}</div><div style="font-size:9.5px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.n }}</div></div><svg width="54" height="26" viewBox="0 0 54 26"><path d="{{ m.sp }}" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" from="120" to="0" dur="1.4s" fill="freeze"></animate></path></svg></div></sc-for>
          <div style="border-radius:14px;background:#0e0e0e;color:#fff;padding:9px 12px;display:flex;align-items:center;gap:10px"><div style="display:flex"><span style="width:24px;height:24px;border-radius:50%;background:#d2ff1f;color:#111;display:grid;place-items:center;font-size:9px;font-weight:700;border:2px solid #0e0e0e">MK</span><span style="width:24px;height:24px;border-radius:50%;background:#c5effd;color:#111;display:grid;place-items:center;font-size:9px;font-weight:700;border:2px solid #0e0e0e;margin-left:-8px">PL</span><span style="width:24px;height:24px;border-radius:50%;background:#ffc9c9;color:#111;display:grid;place-items:center;font-size:9px;font-weight:700;border:2px solid #0e0e0e;margin-left:-8px">AC</span></div><div style="font-size:10px;line-height:1.35"><b style="color:#d2ff1f">Live</b><br>3 teammates here</div><span style="margin-left:auto;width:8px;height:8px;border-radius:50%;background:#d2ff1f;animation:pulse 1.6s infinite"></span></div>
        </div>
        <sc-if value="{{ show.core }}" hint-placeholder-val="{{ true }}"><dc-import name="EBCore" screen="{{ screen }}" hint-size="100%,760px"></dc-import></sc-if>
        <sc-if value="{{ show.comms }}" hint-placeholder-val="{{ false }}"><dc-import name="EBComms" screen="{{ screen }}" hint-size="100%,760px"></dc-import></sc-if>
        <sc-if value="{{ show.work }}" hint-placeholder-val="{{ false }}"><dc-import name="EBWork" screen="{{ screen }}" hint-size="100%,760px"></dc-import></sc-if>
        <sc-if value="{{ show.meet }}" hint-placeholder-val="{{ false }}"><dc-import name="EBMeet" screen="{{ screen }}" hint-size="100%,760px"></dc-import></sc-if>
        <sc-if value="{{ show.agents }}" hint-placeholder-val="{{ false }}"><dc-import name="EBAgents" screen="{{ screen }}" hint-size="100%,760px"></dc-import></sc-if>
        <sc-if value="{{ show.viewers }}" hint-placeholder-val="{{ false }}"><dc-import name="EBViewers" screen="{{ screen }}" hint-size="100%,760px"></dc-import></sc-if>
        <sc-if value="{{ show.apps }}" hint-placeholder-val="{{ false }}"><dc-import name="EBApps" screen="{{ screen }}" hint-size="100%,760px"></dc-import></sc-if>
        <sc-if value="{{ show.admin }}" hint-placeholder-val="{{ false }}"><dc-import name="EBAdmin" screen="{{ screen }}" hint-size="100%,760px"></dc-import></sc-if>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>

  go(n) { this.setState({ screen: n }); try { localStorage.setItem('eb_screen', n); } catch (e) {} }
  renderVals() {

      ['Communications & Knowledge', 'comms', [[5,'Communications & Email Feed','/communications','Everyone','To Adapt'],[6,'Email Thread & AI Extraction','/communications/[id]','Everyone','To Adapt'],[7,'Email Composer & Reply','Drawer','Everyone','To Adapt'],[8,'Knowledge Hub','/knowledge','Everyone','To Adapt'],[9,'Knowledge File Vault','/knowledge/files','Everyone','To Adapt'],[10,'Structured Bases','/knowledge/bases','Everyone','To Adapt'],[11,'Visual Knowledge Graph','/knowledge/graph','Everyone','To Adapt']]],

    const rail = R.map(([k, n, label]) => { const on = cur === n; return { paths: P[k], label, go: () => this.go(n), bg: on ? '#0e0e0e' : 'transparent', fg: on ? '#fff' : '#333' }; });

</script>
