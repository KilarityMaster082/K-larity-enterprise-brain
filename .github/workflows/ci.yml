# Owner task: EB-17 CI: lint, tests, licence scan and secret scan
# Status: governance + unit-test jobs live; lint, licence and secret scan jobs land with EB-17.
name: ci

on:
  push:
    branches: [main, Dev]
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    name: Repository governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Layout, ownership, licence boundaries, vendored-code integrity
        run: python ops/ci/check_structure.py
      - name: No store call outside a tenant-scoped wrapper
        run: python ops/ci/check_tenant_scope.py
      - name: Borrow map is up to date with the register snapshot
        run: python ops/ci/borrow_map.py --check

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3 cryptography==50.0.1
      - run: make test
