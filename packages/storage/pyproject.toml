# Owner task: EB-85 Tenant registry and control plane
# Stdlib only at runtime; backend client libraries (S3 etc.) need licence review first (CLAUDE.md rule 7).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klarity-storage"
version = "0.1.0"
description = "K!larity tenant-scoped store wrappers"
requires-python = ">=3.11"
dependencies = ["klarity-tenant-context"]

[tool.setuptools]
packages = ["storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
